    <path d="M0 -12 C4 -2, 6 4, 0 12 C-6 4, -4 -2, 0 -12 Z" fill="#fef08a" />
    <!-- Science Atoms / Orbit Rings -->
    <ellipse cx="0" cy="5" rx="55" ry="20" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(-30)" />
    <ellipse cx="0" cy="5" rx="55" ry="20" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(30)" />
    <circle cx="42" cy="-18" r="4.5" fill="#38bdf8" />
    <circle cx="-42" cy="-18" r="4.5" fill="#38bdf8" />
  </g>
  <text x="256" y="405" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="26" letter-spacing="2">GOVT. HOLKAR SCIENCE</text>
  <text x="256" y="435" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="4">COLLEGE INDORE</text>
  <text x="256" y="95" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="3">ESTD. 1891 • AUTONOMOUS</text>
