<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function() {
        function isVite(obj) {
          if (!obj) return false;
          try {
            var str = String(obj.message || '') + ' ' + String(obj.stack || '') + ' ' + String(obj.reason || '') + ' ' + String(obj.filename || '') + ' ' + String(obj);
            if (str.indexOf('[vite]') !== -1 || (str.indexOf('vite') !== -1 && str.indexOf('ws') !== -1)) return true;
            if (typeof obj === 'object') {
              var json = JSON.stringify(obj);
              if (json && json.indexOf('[vite]') !== -1) return true;
            }
          } catch(e) {}
          return false;
        }

        // 1. Intercept all console methods
        ['log', 'warn', 'error', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isVite(arguments[i])) return;
            }
            if (orig) orig.apply(console, arguments);
          };
        });

        // 2. Intercept uncaught errors and rejections in capture phase
        window.addEventListener('error', function(e) {
          if (isVite(e) || (e.message && isVite(e.message)) || (e.error && isVite(e.error))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isVite(e) || isVite(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Holkar Sci" />
    <meta name="application-name" content="Holkar Sci" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Government Holkar Science College Indore</title>
    <meta name="description" content="Official mobile application for Government Holkar (Model, Autonomous) Science College, Indore, Madhya Pradesh providing public academic information, notices, and student portal." />
    <meta property="og:title" content="Government Holkar Science College Indore" />
    <meta property="og:description" content="Official mobile application for Government Holkar (Model, Autonomous) Science College, Indore, Madhya Pradesh providing public academic information, notices, and student portal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
